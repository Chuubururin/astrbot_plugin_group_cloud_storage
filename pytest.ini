[pytest]
asyncio_mode = auto
testpaths = tests
# --strict-markers：marker 名打错（或忘注册）时直接 collection error，
# 而不是 warning + fixture 静默走默认分支（"测试仍绿但白等退避"）。
addopts = --strict-markers
# 硬性单测墙钟上界（pytest-timeout）。没有它，一次挂起只能等 runner 的
# 默认上限（最长 360 分钟）——2026-09-21 的 CI 挂起就是这么白烧掉的。
# 插件缺失时该 ini 键会被忽略，所以裸环境不会被卡住。
timeout = 60
markers =
    ffmpeg: tests requiring an ffmpeg executable
    pillow: tests requiring Pillow image support
    smb: tests requiring the optional SMB client
    sqlite: SQLite-specific tests (always run)
    integration: integration tests requiring external services
    optional: tests that may be skipped in minimal environments
    slow: tests involving long-running media processing or polling
    no_backoff: 只断言重试次数/终态的用例；队列以 backoff_base=0 构造，且 essence 的 CONFIRM/REBUILD_RETRY_INTERVAL 一并归零，跳过退避与轮询等待
