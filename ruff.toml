# Ruff configuration — rule selection kept deliberately narrow:
# E4/E7/E9 + F are ruff's "real bug" set (undefined names, unused imports,
# syntax-level mistakes). Style opinions (import order, quoting, blind
# excepts) are intentionally not gated; enabling them later is a separate
# cleanup, not a CI gate.
line-length = 120
target-version = "py310"

[lint]
select = ["E4", "E7", "E9", "F", "B"]

[lint.per-file-ignores]
# Re-export shims and deliberate late imports live in __init__ files.
"__init__.py" = ["F401", "E402"]
# Tests keep intentional unused locals (handles, captured stubs).
"tests/*" = ["F841"]
