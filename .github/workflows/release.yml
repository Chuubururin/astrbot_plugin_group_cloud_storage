name: Release

# 推送 v* tag 触发：校验 tag 与 metadata.yaml 一致 → 重跑全部 CI 检查 →
# 复用 scripts/release.sh 打包 → 挂 zip 与 sha256 发布 GitHub Release。
# 预发布版本用带连字符的 tag（如 v0.0.8-rc.1），自动标记为 prerelease。

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 校验 tag 与 metadata.yaml 版本一致
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="$(sed -n 's/^version: *//p' metadata.yaml | tr -d '\"'"'"'')"
          if [[ "v$version" != "$tag" ]]; then
            echo "::error::tag $tag 与 metadata.yaml version $version 不一致；先在 metadata.yaml 更新 version 再打 tag"
            exit 1
          fi
          echo "tag=$tag version=$version 一致"

      - name: 校验 tag 指向 main 可达提交
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::tag 不在 main 分支历史内；发布 tag 必须打在 main 上"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Ruff（与 CI 同版本锁定）
        run: pip install "ruff==0.16.6" && ruff check . --output-format=github

      - name: Python 单测
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio
          python -m pytest tests/unit/ -x -q

      - name: 前端单测与契约检查
        run: |
          npm ci --ignore-scripts
          npm run test:unit
          pip install pytest pytest-asyncio
          python tools/check_import_contracts.py

  build:
    runs-on: ubuntu-latest
    needs: preflight
    steps:
      - uses: actions/checkout@v4

      - name: 打包（复用 scripts/release.sh）
        run: ./scripts/release.sh dist

      - name: 重命名产物并生成 sha256
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          cd dist
          mv astrbot_plugin_group_cloud_storage.zip \
            "astrbot_plugin_group_cloud_storage-${tag}.zip"
          sha256sum "astrbot_plugin_group_cloud_storage-${tag}.zip" \
            > "astrbot_plugin_group_cloud_storage-${tag}.zip.sha256"
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: release-zip
          path: |
            dist/astrbot_plugin_group_cloud_storage-*.zip
            dist/astrbot_plugin_group_cloud_storage-*.zip.sha256
          retention-days: 3
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: release-zip
          path: dist

      - name: 生成中文 release note
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          previousTag="$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || true)"
          if [[ -n "$previousTag" ]]; then
            range="$previousTag..$tag"
            comparison="[查看 ${previousTag} → ${tag} 完整差异](https://github.com/${GITHUB_REPOSITORY}/compare/${previousTag}...${tag})"
          else
            range="$tag"
            comparison=""
          fi
          changes="$(git log --no-merges --pretty=format:"- %s ([%h](https://github.com/${GITHUB_REPOSITORY}/commit/%H))" "$range" || true)"
          [[ -z "$changes" ]] && changes="- 无提交记录。"
          {
            echo "# 群云存储管理器 ${tag}"
            echo ""
            echo "## 安装"
            echo ""
            echo "下载下方 zip，解压到 AstrBot \`data/plugins/astrbot_plugin_group_cloud_storage\` 后重载插件；"
            echo "或直接使用 AstrBot 插件市场更新。完整校验和见 \`.sha256\` 文件。"
            echo ""
            echo "## 本次更新"
            echo ""
            echo "$changes"
            echo ""
            if [[ -n "$comparison" ]]; then
              echo "$comparison"
            fi
          } > release-notes.md
          cat release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            dist/astrbot_plugin_group_cloud_storage-*.zip
            dist/astrbot_plugin_group_cloud_storage-*.zip.sha256
          prerelease: ${{ contains(github.ref_name, '-') }}
