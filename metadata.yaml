name: astrbot_plugin_group_cloud_storage
display_name: 群云存储管理器
short_desc: QQ 群文件/相册/精华统一管理，支持网盘转存与 WebUI 面板
desc: QQ 群原生云存储（群文件 / 群相册 / 精华消息）统一管理插件。支持群文件浏览、搜索、上传下载，相册图片/视频浏览，精华消息长文保存与分段，OpenList 网盘双向转存，任务记录与进度管理，多群批量管理，提供 WebUI 管理面板。
